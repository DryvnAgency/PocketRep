name: Elite copy one-shot

on:
  push:
    branches:
      - marketing/elite-launch-copy
    paths:
      - .github/workflows/elite-copy-one-shot.yml

permissions:
  contents: write

jobs:
  patch-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: marketing/elite-launch-copy
      - name: Apply final landing copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Pocketrep/index.html')
          s = p.read_text()
          replacements = {
            "PocketRep helps car salespeople automate follow-up, ask for referrals, and stay top of mind with every customer they've sold. Your book, in your pocket.": "PocketRep helps car salespeople work their book, stay consistent with follow-up, and stay top of mind with every customer they've sold. Your book, in your pocket.",
            "Automate your follow-up, ask for referrals, and stay top of mind with every customer you've sold. Your book follows you, not the dealership.": "Work your book, stay consistent with follow-up, and stay top of mind with every customer you've sold. Your book follows you, not the dealership.",
            "Automate your follow-up, ask for referrals, and stay top of mind with every customer you've sold.": "Work your book, stay consistent with follow-up, and stay top of mind with every customer you've sold.",
            "Automated follow-up, referral asks, and top-of-mind outreach to every customer you've ever sold. Rex tells you who to text and writes it in your voice. You just tap send.": "PocketRep turns the book you've already built into a daily follow-up system. Rex shows you who needs attention and drafts the next move in your voice. You review it. You send it. You stay in control.",
            "Automates your follow-up so no sold customer ever goes cold.": "Turns your book into a daily follow-up plan, so the right customers don't disappear into your phone.",
            "Keeps you top of mind with every past customer, without lifting a finger.": "Keeps your past customers organized and in play, without relying on memory.",
            "Stay top of mind without lifting a finger.": "Stay top of mind with a system.",
            "aria-label=\"Nurture Engine in PocketRep queuing steady follow-up touches for anniversaries, lease-ends, and service reminders\"": "aria-label=\"Nurture Engine in PocketRep queuing seasonal and milestone follow-up drafts for review\"",
            "aria-label=\"Smart Blast in PocketRep personalizing texts for your entire customer list, ready to send in a couple taps\"": "aria-label=\"Smart Blast in PocketRep drafting a personalized message for each customer for the rep to review and send\"",
          }
          missing=[]
          for old,new in replacements.items():
            if old not in s:
              missing.append(old)
            s=s.replace(old,new)
          if missing:
            raise SystemExit('Missing expected copy:\n' + '\n'.join(missing))
          p.write_text(s)
          PY
      - name: Commit copy polish
        run: |
          git config user.name "PocketRep Launch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Pocketrep/index.html
          git commit -m "Polish landing copy for premium V1 launch"
          git push origin HEAD:marketing/elite-launch-copy
