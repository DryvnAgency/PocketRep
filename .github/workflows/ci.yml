name: CI

# Minimum CI floor: typecheck + lint the Expo app on every PR (and on main).
# This is the first automated gate besides the Vercel preview builds.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-checks:
    name: Typecheck + Lint (PocketRepApp)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PocketRepApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: PocketRepApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Lint (eslint)
        run: npm run lint

      - name: Referral tests
        run: npm run test:referral

      - name: Production hardening tests
        run: npm run test:productionhardening
