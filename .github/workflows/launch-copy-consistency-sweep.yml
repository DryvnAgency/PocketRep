name: Final launch funnel consistency sweep

on:
  push:
    branches:
      - claude/quirky-babbage-f0s519

permissions:
  contents: write

jobs:
  sweep:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/quirky-babbage-f0s519
          fetch-depth: 0

      - name: Remove remaining hidden and demo overclaims
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('Pocketrep/index.html')
          s = index.read_text(encoding='utf-8')

          replacements = {
            'Yes. PocketRep is a personal CRM and follow-up app built for car salespeople. Your customers stay yours and follow you between dealerships, unlike a dealership CRM.':
              "PocketRep is a personal CRM and follow-up app built for car salespeople. Your PocketRep workspace stays with your account; only keep and use customer data you're authorized to use.",
            '<span><span class="ck">✓</span> Your book follows you</span>':
              '<span><span class="ck">✓</span> Your PocketRep workspace stays with you</span>',
            'No, nothing sends until you review and tap send. PocketRep drafts the message in your voice and you send it yourself.':
              'No. Nothing sends until you review and take the send action. PocketRep drafts from the context you provide and you stay in control.',
            'toggleRow("Auto-extract from voice notes", "Rex pulls contacts + follow-ups when you dictate", true)':
              'toggleRow("Follow-up reminders", "Keep promised callbacks visible", true)',
            'toggleRow("Morning Heat Sheet push", "7:30am, before your coffee", true)':
              'toggleRow("Heat Sheet focus", "Start with overdue and high-priority follow-up", true)',
            'toggleRow("Weekly pipeline digest", "Mondays from Rex", true)':
              'toggleRow("Weekly recap", "Review activity and what needs attention next", true)',
            'Want me to queue it to send?':
              'Want me to open it for review?',
          }

          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected landing copy: {old[:80]}')
              s = s.replace(old, new)

          forbidden = [
              'Your customers stay yours and follow you between dealerships',
              'Auto-extract from voice notes',
              'Morning Heat Sheet push',
              'Want me to queue it to send?',
          ]
          for phrase in forbidden:
              if phrase in s:
                  raise SystemExit(f'Stale funnel claim remains: {phrase}')

          index.write_text(s, encoding='utf-8')

          terms = Path('Pocketrep/terms.html')
          t = terms.read_text(encoding='utf-8')
          old = '<p>Questions? Email us at <a href="mailto:legal@pocketrep.pro">legal@pocketrep.pro</a></p>'
          new = '<p>Questions? Email us at <a href="mailto:service@pocketrep.pro">service@pocketrep.pro</a></p>'
          if old not in t:
              raise SystemExit('Expected Terms contact line not found')
          terms.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit consistency sweep
        shell: bash
        run: |
          git config user.name "PocketRep Launch Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/launch-copy-consistency-sweep.yml
          git add Pocketrep/index.html Pocketrep/terms.html
          git diff --cached --check
          git commit -m "Remove remaining launch funnel overclaims"
          git push origin HEAD:claude/quirky-babbage-f0s519
