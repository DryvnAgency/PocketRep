name: Temporary support image wiring
on:
  push:
    branches: [fix/support-image-attachments]
    paths: ['.github/workflows/tmp-support-image-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/support-image-attachments
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch rep/admin support chat
        run: |
          python - <<'PY'
          from pathlib import Path

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing anchor: {label}')
              return text.replace(old, new, 1)

          # Rep chat
          p = Path('PocketRepApp/components/v2/SupportChat.tsx')
          s = p.read_text()
          s = must_replace(s,
              "import { colors, radius } from '@/constants/theme';\n",
              "import { colors, radius } from '@/constants/theme';\nimport * as ImagePicker from 'expo-image-picker';\nimport SupportAttachment from './SupportAttachment';\n",
              'rep imports')
          s = must_replace(s,
              "  loadMyTickets, createTicket, loadMessages, sendMessage, reopenTicket,\n",
              "  loadMyTickets, createTicket, loadMessages, sendMessage, sendImageMessage, reopenTicket,\n",
              'rep data import')
          s = must_replace(s,
              "  const [sending, setSending] = useState(false);\n",
              "  const [sending, setSending] = useState(false);\n  const [uploading, setUploading] = useState(false);\n",
              'rep upload state')
          anchor = "  const handleCreateTicket = async () => {\n"
          handler = """  const handleAttach = async () => {\n    if (!selectedTicketId || uploading || sending) return;\n    setUploading(true);\n    try {\n      const permission = await ImagePicker.requestMediaLibraryPermissionsAsync();\n      if (!permission.granted) { setError('Photo access is required to attach a screenshot'); return; }\n      const picked = await ImagePicker.launchImageLibraryAsync({\n        mediaTypes: ImagePicker.MediaTypeOptions.Images,\n        allowsEditing: false,\n        quality: 0.85,\n      });\n      if (picked.canceled || !picked.assets?.[0]) return;\n      const asset = picked.assets[0];\n      await sendImageMessage({\n        ticketId: selectedTicketId,\n        senderRole: 'rep',\n        uri: asset.uri,\n        mimeType: asset.mimeType,\n        fileName: asset.fileName,\n        fileSize: asset.fileSize,\n      });\n      setError('');\n      setRefreshKey(k => k + 1);\n    } catch (e) {\n      setError(e instanceof Error ? e.message : 'Could not attach image - try again');\n    } finally {\n      setUploading(false);\n    }\n  };\n\n"""
          s = must_replace(s, anchor, handler + anchor, 'rep attach handler')
          s = must_replace(s,
              "              <Text style={styles.bubbleText}>{m.content}</Text>\n",
              "              {m.content && m.content !== '[Image attachment]' ? <Text style={styles.bubbleText}>{m.content}</Text> : null}\n              {m.attachment_path ? <SupportAttachment path={m.attachment_path} name={m.attachment_name} /> : null}\n",
              'rep attachment render')
          s = must_replace(s,
              "            <TextInput\n              style={styles.input}\n",
              "            <Pressable\n              style={[styles.sendBtn, (uploading || sending) && { opacity: 0.4 }]}\n              onPress={handleAttach}\n              disabled={uploading || sending}\n              accessibilityLabel=\"Attach image\"\n            >\n              <Text style={styles.sendIcon}>{uploading ? '…' : '📎'}</Text>\n            </Pressable>\n            <TextInput\n              style={styles.input}\n",
              'rep paperclip')
          s = s.replace("editable={!sending}", "editable={!sending && !uploading}")
          p.write_text(s)

          # Admin chat
          p = Path('PocketRepApp/components/v2/AdminSupportDashboard.tsx')
          s = p.read_text()
          s = must_replace(s,
              "import { colors, radius } from '@/constants/theme';\n",
              "import { colors, radius } from '@/constants/theme';\nimport * as ImagePicker from 'expo-image-picker';\nimport SupportAttachment from './SupportAttachment';\n",
              'admin imports')
          s = must_replace(s,
              "  loadAllTickets, loadMessages, sendMessage, resolveTicket, reopenTicket,\n",
              "  loadAllTickets, loadMessages, sendMessage, sendImageMessage, resolveTicket, reopenTicket,\n",
              'admin data import')
          s = must_replace(s,
              "  const [sending, setSending] = useState(false);\n",
              "  const [sending, setSending] = useState(false);\n  const [uploading, setUploading] = useState(false);\n",
              'admin upload state')
          anchor = "  const handleResolve = async () => {\n"
          handler = """  const handleAttach = async () => {\n    if (!selectedTicketId || !selectedTicket?.user_id || uploading || sending) return;\n    setUploading(true);\n    try {\n      const permission = await ImagePicker.requestMediaLibraryPermissionsAsync();\n      if (!permission.granted) { setError('Photo access is required to attach a screenshot'); return; }\n      const picked = await ImagePicker.launchImageLibraryAsync({\n        mediaTypes: ImagePicker.MediaTypeOptions.Images,\n        allowsEditing: false,\n        quality: 0.85,\n      });\n      if (picked.canceled || !picked.assets?.[0]) return;\n      const asset = picked.assets[0];\n      await sendImageMessage({\n        ticketId: selectedTicketId,\n        senderRole: 'admin',\n        ownerUserId: selectedTicket.user_id,\n        uri: asset.uri,\n        mimeType: asset.mimeType,\n        fileName: asset.fileName,\n        fileSize: asset.fileSize,\n      });\n      setError('');\n      setRefreshKey(k => k + 1);\n    } catch (e) {\n      setError(e instanceof Error ? e.message : 'Could not attach image - try again');\n    } finally {\n      setUploading(false);\n    }\n  };\n\n"""
          # Admin handler needs selectedTicket, which is declared below handlers in current source.
          # Avoid temporal use by resolving the owner directly from tickets here.
          handler = handler.replace("!selectedTicket?.user_id", "!tickets.find(t => t.id === selectedTicketId)?.user_id")
          handler = handler.replace("ownerUserId: selectedTicket.user_id,", "ownerUserId: tickets.find(t => t.id === selectedTicketId)!.user_id,")
          s = must_replace(s, anchor, handler + anchor, 'admin attach handler')
          s = must_replace(s,
              "              <Text style={styles.bubbleText}>{m.content}</Text>\n",
              "              {m.content && m.content !== '[Image attachment]' ? <Text style={styles.bubbleText}>{m.content}</Text> : null}\n              {m.attachment_path ? <SupportAttachment path={m.attachment_path} name={m.attachment_name} /> : null}\n",
              'admin attachment render')
          s = must_replace(s,
              "            <TextInput\n              style={styles.input}\n",
              "            <Pressable\n              style={[styles.sendBtn, (uploading || sending) && { opacity: 0.4 }]}\n              onPress={handleAttach}\n              disabled={uploading || sending}\n              accessibilityLabel=\"Attach image\"\n            >\n              <Text style={styles.sendIcon}>{uploading ? '…' : '📎'}</Text>\n            </Pressable>\n            <TextInput\n              style={styles.input}\n",
              'admin paperclip')
          s = s.replace("editable={!sending}", "editable={!sending && !uploading}")
          p.write_text(s)
          PY
          git config user.name 'DryvnAgency'
          git config user.email 'dryvnagency@gmail.com'
          git add PocketRepApp/components/v2/SupportChat.tsx PocketRepApp/components/v2/AdminSupportDashboard.tsx
          git commit -m 'support: wire image attachments in rep and admin chat'
          git push origin HEAD:fix/support-image-attachments
