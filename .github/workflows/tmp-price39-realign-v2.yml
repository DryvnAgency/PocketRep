name: Temporary V1 $39 realignment v2

on:
  push:
    branches: [fix/v1-price-39-realign]

permissions:
  contents: write

jobs:
  realign:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1-price-39-realign
      - name: Apply $39 launch truth
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ACTIVE_URL='https://buy.stripe.com/cNi4gAbMn4kg9Ax5AucbC06'
          OLD_URL='https://buy.stripe.com/3cI3cw3fRcQM141bYScbC09'
          CURRENT='price_1Tf6MeIKMImSDGHZvYLmeIqS'
          LEGACY='price_1UBDLeIKMImSDGHZqrYthX3H'

          def rep(path, old, new, required=True):
              p=Path(path); s=p.read_text()
              n=s.count(old)
              if required and n == 0: raise SystemExit(f'{path}: missing {old!r}')
              if n: p.write_text(s.replace(old,new))
              print(path, old, '=>', new, 'hits', n)

          rep('Pocketrep/index.html', OLD_URL, ACTIVE_URL)
          rep('Pocketrep/index.html', '"price":"29.00"', '"price":"39.00"')
          rep('Pocketrep/index.html', 'Founding Rep access is 29.00 USD per month', 'Founding Rep access is 39.00 USD per month')
          rep('Pocketrep/index.html', 'PocketRep V1 Founding Rep access is 29 USD per month', 'PocketRep V1 Founding Rep access is 39 USD per month')
          rep('Pocketrep/index.html', '$29', '$39')
          rep('Pocketrep/thankyou.html', '$29', '$39')
          rep('Pocketrep/llms.txt', '$29', '$39')
          rep('PocketRepApp/app/(auth)/signup.tsx', OLD_URL, ACTIVE_URL)
          rep('PocketRepApp/app/(auth)/signup.tsx', '$29', '$39')

          p=Path('PocketRepApp/supabase/functions/checkout-account/index.ts'); s=p.read_text()
          old=f'const V1_FOUNDING_PRICE_ID = "{LEGACY}";'
          if old not in s: raise SystemExit('checkout-account old price constant missing')
          s=s.replace(old, f'const V1_CURRENT_PRICE_ID = "{CURRENT}";\nconst V1_LEGACY_29_PRICE_ID = "{LEGACY}";', 1)
          old='return new Set([STRIPE_PRICE_ID, V1_FOUNDING_PRICE_ID].filter(Boolean));'
          if old not in s: raise SystemExit('checkout-account allowlist missing')
          s=s.replace(old, 'return new Set([STRIPE_PRICE_ID, V1_CURRENT_PRICE_ID, V1_LEGACY_29_PRICE_ID].filter(Boolean));', 1)
          p.write_text(s)

          p=Path('CURRENT_STATE_DECISIONS.md'); s=p.read_text()
          changes=[
            ('- **V1 Founding Rep: $29/month** for the current individual product.', '- **V1 Founding Rep: $39/month** for the current individual product.\n- The temporary $29 launch cutover is **retired**; do not advertise or route new customers to the retired $29 Payment Link.'),
            (f'- V1 founding price: `{LEGACY}` — $29/month', f'- Current V1 price: `{CURRENT}` — $39/month'),
            ('- V1 founding Payment Link: `plink_1UBDMJIKMImSDGHZWJqPzLRP`', '- Current V1 Payment Link: `plink_1TfLSuIKMImSDGHZWS0cW3QV`'),
            (f'- Checkout URL: `{OLD_URL}`', f'- Checkout URL: `{ACTIVE_URL}`'),
            ('- `checkout-account` **v15 ACTIVE** as of the 2026-09-02 pricing cutover preparation; it accepts both the prior live PocketRep price and the new V1 founding price while preserving strict checkout/session/customer-rebind verification.', '- `checkout-account` **v15 ACTIVE**; current public V1 checkout is the $39 price, while retired $29 sessions remain accepted only for safe historical/in-flight provisioning compatibility. Strict checkout/session/customer-rebind verification remains in place.'),
            ('- checkout-account v15 dual-price compatibility for the $29 cutover.', '- checkout-account v15 dual-price compatibility retained: $39 is current; retired $29 sessions can still complete historical/in-flight provisioning.'),
          ]
          for old,new in changes:
              if old not in s: raise SystemExit(f'CURRENT_STATE missing: {old}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY

          cat > PocketRepApp/scripts/test-pricing-cutover.mjs <<'EOF'
          import { readFileSync } from 'node:fs';
          import { dirname, resolve } from 'node:path';
          import { fileURLToPath } from 'node:url';

          const here = dirname(fileURLToPath(import.meta.url));
          const appRoot = resolve(here, '..');
          const repoRoot = resolve(appRoot, '..');
          const landing = readFileSync(resolve(repoRoot, 'Pocketrep/index.html'), 'utf8');
          const thankyou = readFileSync(resolve(repoRoot, 'Pocketrep/thankyou.html'), 'utf8');
          const llms = readFileSync(resolve(repoRoot, 'Pocketrep/llms.txt'), 'utf8');
          const signup = readFileSync(resolve(appRoot, 'app/(auth)/signup.tsx'), 'utf8');
          const checkout = readFileSync(resolve(appRoot, 'supabase/functions/checkout-account/index.ts'), 'utf8');
          const decisions = readFileSync(resolve(repoRoot, 'CURRENT_STATE_DECISIONS.md'), 'utf8');
          const CURRENT_URL = 'https://buy.stripe.com/cNi4gAbMn4kg9Ax5AucbC06';
          const RETIRED_29_URL = 'https://buy.stripe.com/3cI3cw3fRcQM141bYScbC09';
          const CURRENT_PRICE = 'price_1Tf6MeIKMImSDGHZvYLmeIqS';
          const LEGACY_29_PRICE = 'price_1UBDLeIKMImSDGHZqrYthX3H';

          function inc(label, source, needles) { for (const n of needles) if (!source.includes(n)) throw new Error(`${label}: missing ${n}`); }
          function exc(label, source, needles) { for (const n of needles) if (source.includes(n)) throw new Error(`${label}: stale/unsupported ${n}`); }

          inc('landing', landing, ['"price":"39.00"','<span class="now">$39</span>','Founding Rep access is $39/month','Day 8 — $39/mo begins if the subscription is still active','Is PocketRep worth $39 a month?','$39/mo Founding Rep rate.','Founding rate · $39/mo while subscription stays active',CURRENT_URL,'7-day free trial']);
          exc('landing', landing, [RETIRED_29_URL,'"price":"29.00"','<span class="now">$29</span>','Founding Rep access is $29/month','Day 8 — $29/mo begins','Is PocketRep worth $29 a month?','$29/mo Founding Rep rate.','Founding rate · $29/mo while subscription stays active','Next new-customer cohort: $54/mo after the first 500','First 500 paying reps','39 USD per month for the first 500','The first 500 paying reps get the $39 monthly founding rate','$39/mo founding rate for the first 500 paying reps','Founding rate · $39/mo locked forever','still here with your name on it','trade at the top of the range','charging + warranty are no contest','saved you the 540i','m340i in portimao is rare','want me to hold it while you decide']);
          inc('thankyou', thankyou, ['$39 founding software subscription rate']); exc('thankyou', thankyou, ['$29 founding software subscription rate']);
          inc('llms', llms, ['$39 per month','7-day free trial','continuously active']); exc('llms', llms, ['$29 per month']);
          inc('signup', signup, [CURRENT_URL,'FOUNDING REP','$39','automotive sales reps']); exc('signup', signup, [RETIRED_29_URL,'$29',"name: 'Rex Lens'","name: 'PocketRep Elite",'What do you sell?']);
          inc('checkout-account', checkout, [`const V1_CURRENT_PRICE_ID = "${CURRENT_PRICE}"`,`const V1_LEGACY_29_PRICE_ID = "${LEGACY_29_PRICE}"`,'allowedStripePriceIds()','!allowedPriceIds.has(checkoutPriceId)','account_already_billed']);
          inc('decisions', decisions, ['**V1 Founding Rep: $39/month**','temporary $29 launch cutover is **retired**',`Current V1 price: \`${CURRENT_PRICE}\` — $39/month`,`Checkout URL: \`${CURRENT_URL}\``,'**V2 direction for new customers: $49/month**','**V3 direction for new customers: $69/month**','**RexLens is separate/out-of-scope from PocketRep.']);
          console.log('PocketRep V1 $39 pricing alignment guard OK');
          EOF

          rm -f .github/workflows/tmp-price39-realign.yml .github/workflows/tmp-price39-realign-v2.yml
          git config user.name "PocketRep Pricing Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: realign PocketRep V1 launch pricing to $39"
          git push origin HEAD:fix/v1-price-39-realign
