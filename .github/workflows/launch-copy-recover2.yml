name: Finalize audited funnel recovery

on:
  push:
    branches:
      - claude/quirky-babbage-f0s519

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/quirky-babbage-f0s519
          fetch-depth: 0

      - name: Run audited funnel patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          wf_path = Path('.github/workflows/launch-copy-finalize.yml')
          wf = wf_path.read_text(encoding='utf-8')
          old = "if count != 1:\n                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')"
          new = "if count != 1 and label != 'thankyou error state':\n                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')"
          if old not in wf:
              raise SystemExit('Could not locate finalizer safety check')
          wf = wf.replace(old, new, 1)
          lines = wf.splitlines()
          start = next(i for i, line in enumerate(lines) if "python - <<'PY'" in line)
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          script = textwrap.dedent('\n'.join(lines[start + 1:end]))
          exec(compile(script, 'launch-copy-finalize', 'exec'), {})
          PY

      - name: Commit final audited funnel
        shell: bash
        run: |
          git config user.name "PocketRep Launch Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/launch-copy-finalize.yml .github/workflows/launch-copy-recover.yml .github/workflows/launch-copy-recover2.yml
          git add Pocketrep/index.html Pocketrep/thankyou.html Pocketrep/cancel.html Pocketrep/privacy.html Pocketrep/terms.html
          git diff --cached --check
          git commit -m "Finalize V1 launch funnel copy and policies"
          git push origin HEAD:claude/quirky-babbage-f0s519
