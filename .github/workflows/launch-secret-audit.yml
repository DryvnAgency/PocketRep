name: Launch secret audit

on:
  push:
    branches:
      - ops/launch-secret-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check Supabase credential wiring
        id: credential
        shell: bash
        run: |
          set +x
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "supabase_access_token=present" >> "$GITHUB_OUTPUT"
            echo "Supabase deployment credential: PRESENT"
          else
            echo "supabase_access_token=missing" >> "$GITHUB_OUTPUT"
            echo "Supabase deployment credential: MISSING"
          fi

      - name: Check Edge Function secret names
        if: steps.credential.outputs.supabase_access_token == 'present'
        shell: bash
        run: |
          set +x
          npx --yes supabase@2.81.3 secrets list --project-ref fwvrauqdoevwmwwqlfav > /tmp/supabase-secrets.txt
          if grep -qE '(^|[[:space:]])STRIPE_ELITE_PRICE_ID([[:space:]]|$)' /tmp/supabase-secrets.txt; then
            echo "STRIPE_ELITE_PRICE_ID: PRESENT"
          else
            echo "STRIPE_ELITE_PRICE_ID: MISSING"
            exit 2
          fi
