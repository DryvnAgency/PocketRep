name: PR142 import hardening

on:
  push:
    branches:
      - claude/quirky-babbage-f0s519

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/quirky-babbage-f0s519
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch reviewed import error paths and regression guards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('PocketRepApp/app/(tabs)/contacts.tsx')
          s = p.read_text()

          old = "async function loadExistingContactKeys(userId: string): Promise<{ phones: Set<string>; emails: Set<string> }> {\n  const { data } = await supabase\n    .from('contacts')\n    .select('phone,email')\n    .eq('user_id', userId)\n    .eq('is_deleted', false);\n  return {"
          new = "async function loadExistingContactKeys(userId: string): Promise<{ phones: Set<string>; emails: Set<string> }> {\n  const { data, error } = await supabase\n    .from('contacts')\n    .select('phone,email')\n    .eq('user_id', userId)\n    .eq('is_deleted', false);\n  // Dedup is a safety guarantee: never treat a failed verification lookup as an empty book.\n  if (error) throw new Error(`Could not verify existing contacts: ${error.message}`);\n  return {"
          if s.count(old) != 1:
              raise SystemExit('lookup helper target count was not 1')
          s = s.replace(old, new, 1)

          old = "    const { phones: existingPhones, emails: existingEmails } = await loadExistingContactKeys(user.id);\n    const toInsert = dedupeImportRows(candidates, existingPhones, existingEmails);"
          new = "    let existingKeys: { phones: Set<string>; emails: Set<string> };\n    try {\n      existingKeys = await loadExistingContactKeys(user.id);\n    } catch (e: any) {\n      setImporting(false);\n      Alert.alert('Import failed', e?.message ?? 'Could not verify your existing book. Try again.');\n      return;\n    }\n    const { phones: existingPhones, emails: existingEmails } = existingKeys;\n    const toInsert = dedupeImportRows(candidates, existingPhones, existingEmails);"
          if s.count(old) != 1:
              raise SystemExit('device lookup target count was not 1')
          s = s.replace(old, new, 1)

          old = "    try { await supabase.from('contacts').insert(toInsert); await load(); } catch { Alert.alert('Some contacts may not have imported'); }\n    setImporting(false);\n    setShowImport(false);"
          new = "    const { error: insertError } = await supabase.from('contacts').insert(toInsert);\n    if (insertError) {\n      setImporting(false);\n      Alert.alert('Import failed', insertError.message);\n      return;\n    }\n    await load();\n    setImporting(false);\n    setShowImport(false);"
          if s.count(old) != 1:
              raise SystemExit('device insert target count was not 1')
          s = s.replace(old, new, 1)

          old = "    const { phones: existingPhones, emails: existingEmails } = await loadExistingContactKeys(user.id);\n    const fresh = dedupeImportRows(rows, existingPhones, existingEmails);"
          new = "    let existingKeys: { phones: Set<string>; emails: Set<string> };\n    try {\n      existingKeys = await loadExistingContactKeys(user.id);\n    } catch (e: any) {\n      setCsvImporting(false);\n      const message = e?.message ?? 'Could not verify your existing book. Try again.';\n      if (Platform.OS === 'web') (globalThis as any).alert?.(`Import failed: ${message}`);\n      else Alert.alert('Import failed', message);\n      return;\n    }\n    const { phones: existingPhones, emails: existingEmails } = existingKeys;\n    const fresh = dedupeImportRows(rows, existingPhones, existingEmails);"
          if s.count(old) != 1:
              raise SystemExit('csv lookup target count was not 1')
          s = s.replace(old, new, 1)
          p.write_text(s)

          t = Path('PocketRepApp/scripts/test-native-import-dedup.mjs')
          q = t.read_text()
          anchor = "ok('both import paths query the existing book (is_deleted=false) before dedup',\n  (src.match(/\\.eq\\('is_deleted', false\\)/g) || []).length >= 1 && /loadExistingContactKeys/.test(src));"
          extra = anchor + "\n\nconsole.log('\\n--- import safety fails closed on Supabase errors ---');\nok('existing-contact lookup checks Supabase error instead of assuming an empty book',\n  /const \\{ data, error \\} = await supabase[\\s\\S]*?if \\(error\\) throw new Error\\(`Could not verify existing contacts:/.test(src));\nok('device-contact insert checks the Supabase result error before closing the import flow',\n  /const \\{ error: insertError \\} = await supabase\\.from\\('contacts'\\)\\.insert\\(toInsert\\);[\\s\\S]*?if \\(insertError\\)/.test(importSelectedMatch?.[0] ?? ''));"
          if q.count(anchor) != 1:
              raise SystemExit('test anchor count was not 1')
          q = q.replace(anchor, extra, 1)
          t.write_text(q)
          PY

      - name: Install dependencies
        working-directory: PocketRepApp
        run: npm ci

      - name: Typecheck
        working-directory: PocketRepApp
        run: npm run typecheck

      - name: Full regression suite
        working-directory: PocketRepApp
        run: npm run test:all

      - name: Commit passing fix and remove this temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-pr142-import-hardening.yml
          git config user.name "PocketRep QA"
          git config user.email "actions@users.noreply.github.com"
          git add 'PocketRepApp/app/(tabs)/contacts.tsx' PocketRepApp/scripts/test-native-import-dedup.mjs .github/workflows/tmp-pr142-import-hardening.yml
          git commit -m "fix: fail closed on native import verification errors"
          git push origin HEAD:claude/quirky-babbage-f0s519
