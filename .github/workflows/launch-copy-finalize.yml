name: Finalize launch funnel copy

on:
  push:
    branches:
      - claude/quirky-babbage-f0s519

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/quirky-babbage-f0s519
