          cancel_path = root / 'cancel.html'
          privacy_path = root / 'privacy.html'
          terms_path = root / 'terms.html'

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          def replace_section(text, start_marker, end_marker, replacement, label):
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'{label}: start marker not found')
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'{label}: end marker not found')
              return text[:start] + replacement.rstrip() + '\n\n' + text[end:]

          # ------------------------------------------------------------------
          # LANDING PAGE — V1-accurate promise, automotive-only funnel.
          # ------------------------------------------------------------------
          s = index_path.read_text(encoding='utf-8')

