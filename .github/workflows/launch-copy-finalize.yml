              ('<b>PocketRep works in your browser.</b> After setup, we\'ll take you straight into the app.', '<b>Your number. Your relationships. Your approval.</b> PocketRep helps you work the book you already built.', 'thankyou note'),
              ('<div class="success">Account created 🎉</div><p style="color:var(--muted);margin-top:8px;font-size:14px">Logging you into PocketRep…</p>', '<div class="success">Your workspace is ready.</div><p style="color:var(--muted);margin-top:8px;font-size:14px">Opening PocketRep…</p>', 'thankyou done state'),
              ('<span class="eyebrow center" style="justify-content:center">What happens next</span><div style="display:grid;gap:12px;margin-top:16px"><div><b>1. Create your password</b><p style="color:var(--muted);font-size:14px;margin-top:3px">This becomes your PocketRep login.</p></div><div><b>2. Log in automatically</b><p style="color:var(--muted);font-size:14px;margin-top:3px">We\'ll securely hand you into the app after your account is created.</p></div><div><b>3. Start your onboarding</b><p style="color:var(--muted);font-size:14px;margin-top:3px">You\'ll see the example customers and Heat Sheet so you can start using PocketRep immediately.</p></div></div>', '<span class="eyebrow center" style="justify-content:center">Your first move</span><div style="display:grid;gap:12px;margin-top:16px"><div><b>1. Secure your account</b><p style="color:var(--muted);font-size:14px;margin-top:3px">Create your password and enter your private PocketRep workspace.</p></div><div><b>2. Meet your Heat Sheet</b><p style="color:var(--muted);font-size:14px;margin-top:3px">PocketRep starts with example customers so you can see the daily workflow before adding your own book.</p></div><div><b>3. Work your first five</b><p style="color:var(--muted);font-size:14px;margin-top:3px">See who needs attention, let Rex draft the next move, and approve what gets sent.</p></div></div>', 'thankyou onboarding'),
          ]
          for old, new, label in thankyou_replacements:
              t = replace_once(t, old, new, label)
          t = t.replace("We couldn't verify your purchase yet. Please tap Try Again.", "We couldn't verify your checkout yet. Please tap Try Again.")
          t = t.replace('btn.innerHTML="Create My PocketRep Account <span class=\\"arrow\\">→</span>"', 'btn.innerHTML="Enter PocketRep <span class=\\"arrow\\">→</span>"')
          if 'Payment successful' in t or 'Your payment went through' in t:
              raise SystemExit('thankyou stale payment-success copy remains')
          thankyou_path.write_text(t, encoding='utf-8')

          # ------------------------------------------------------------------
          # CANCELLATION — align with actual no-refund + Stripe portal policy.
          # ------------------------------------------------------------------
          c = cancel_path.read_text(encoding='utf-8')
          c = c.replace('Last updated: April 1, 2026', 'Last updated: August 28, 2026')
          start = c.index('<div class="page-wrap">')
          end = c.index('\n\n<footer>', start)
          cancel_body = '''<div class="page-wrap">
            <a href="/" class="back-link">&larr; Back to PocketRep.pro</a>
            <h1>Cancellation Policy</h1>
            <p class="updated">Last updated: August 28, 2026</p>

            <p>You can stop future renewal at any time. The fastest way is the Billing option inside PocketRep, which opens Stripe's secure customer portal.</p>

            <div class="highlight"><p>Cancel before the first trial charge and you will not be billed for a paid subscription.</p></div>

            <h2>1. Free Trial</h2>
            <p>New individual subscriptions include a 7-day free trial when shown at checkout. If you cancel before the first subscription charge, no paid subscription fee is charged. Access may remain available through the end of the trial.</p>

            <h2>2. Paid Subscription Cancellation</h2>
            <ul>
              <li>You may cancel future renewal at any time.</li>
              <li>After cancellation, paid access remains available through the end of the current paid billing period unless Stripe shows otherwise.</li>
              <li>You will not be charged for the next billing cycle after cancellation takes effect.</li>
            </ul>

            <h2>3. How to Cancel</h2>
            <ul>
              <li><strong>In PocketRep:</strong> Open Profile / Settings and choose <strong>Billing</strong> to open the Stripe Customer Portal.</li>
              <li><strong>Support:</strong> If you cannot access Billing, email <a href="mailto:service@pocketrep.pro">service@pocketrep.pro</a> from the email on your account.</li>
            </ul>

            <h2>4. Refund Policy</h2>
            <p>Subscription charges are non-refundable except where a refund is required by applicable law. We do not provide partial or prorated refunds for unused time in a billing period. Cancelling stops future renewal; it does not reverse a charge that has already been collected.</p>

            <h2>5. Account Data</h2>
            <p>Cancelling a subscription does not automatically mean that all account data is immediately deleted. To request deletion of personal data, email <a href="mailto:privacy@pocketrep.pro">privacy@pocketrep.pro</a>. Deletion requests are handled subject to applicable legal, security, fraud-prevention, and backup-retention requirements.</p>

            <h2>6. Resubscribing</h2>
            <p>If you return after cancelling, the price available at the time you resubscribe may apply. Availability of prior account data depends on whether the account or data was deleted.</p>

            <h2>7. Contact</h2>
            <p>Questions about cancellation? Email <a href="mailto:service@pocketrep.pro">service@pocketrep.pro</a>.</p>
          </div>'''
          c = c[:start] + cancel_body + c[end:]
          cancel_path.write_text(c, encoding='utf-8')

          # ------------------------------------------------------------------
          # PRIVACY — reflect actual customer data + provider-agnostic AI path.
          # ------------------------------------------------------------------
          p = privacy_path.read_text(encoding='utf-8')
          p = p.replace('Last updated: April 1, 2026', 'Last updated: August 28, 2026')
          start = p.index('<div class="page-wrap">')
          end = p.index('\n\n<footer>', start)
          privacy_body = '''<div class="page-wrap">
            <a href="/" class="back-link">&larr; Back to PocketRep.pro</a>
            <h1>Privacy Policy</h1>
            <p class="updated">Last updated: August 28, 2026</p>

            <p>PocketRep.pro ("we," "us," or "our") operates the PocketRep website and application. This Privacy Policy explains the information processed by PocketRep and how we use it.</p>

            <h2>1. Information We Process</h2>
            <ul>
              <li><strong>Account information:</strong> information such as your name, email address, account settings, and authentication records.</li>
              <li><strong>Customer and sales data you add:</strong> contact names, phone numbers, email addresses, notes, vehicle or deal information, follow-up history, photos you choose to upload, and related sales context.</li>
              <li><strong>AI interaction data:</strong> prompts, notes, conversation context, drafts, and feedback used to provide Rex features.</li>
              <li><strong>Subscription information:</strong> customer/subscription identifiers and status used to manage access. Card details are processed by Stripe; PocketRep does not store full payment-card numbers.</li>
              <li><strong>Technical and usage data:</strong> device/browser information, logs, feature usage, errors, and security signals needed to operate and improve the service.</li>
            </ul>

            <h2>2. How We Use Information</h2>
            <ul>
              <li>Provide, secure, maintain, and improve PocketRep.</li>
              <li>Organize your contacts, notes, follow-up workflow, deals, reminders, and account settings.</li>
              <li>Generate AI-assisted drafts, summaries, coaching, prioritization, and other Rex outputs you request.</li>
              <li>Process subscriptions, enforce entitlements, prevent abuse, and provide support.</li>
              <li>Send service-related communications such as account, billing, security, and support messages.</li>
            </ul>

            <h2>3. AI Processing</h2>
            <p>PocketRep uses third-party AI gateways and model providers to generate requested AI features. The specific provider or model may change as we improve the service. We aim to send only the context needed for the requested feature and to avoid sending payment-card data or other unnecessary sensitive information to AI providers. PocketRep does not sell your customer content.</p>

            <h2>4. Your Responsibility for Customer Data</h2>
            <p>You are responsible for having the right to store and use customer information you put into PocketRep and for complying with your employer's policies and applicable privacy, marketing, and communications laws when contacting customers.</p>

            <h2>5. Data Retention and Deletion</h2>
            <p>We retain information for as long as reasonably necessary to provide the service, maintain security and billing records, comply with law, resolve disputes, and enforce agreements. To request access, correction, or deletion of personal data, email <a href="mailto:privacy@pocketrep.pro">privacy@pocketrep.pro</a>. Some information may remain in backups or records when legally or operationally required.</p>

            <h2>6. Cookies and Local Storage</h2>
            <p>PocketRep uses cookies, local storage, and similar technologies where needed for authentication, sessions, preferences, security, and core product functionality.</p>

            <h2>7. Service Providers</h2>
            <p>We use service providers to operate PocketRep, including infrastructure for database/authentication, hosting, payments, communications, and AI processing. Current core providers include Supabase, Stripe, Vercel, and third-party AI gateways/model providers. Providers may change as the service evolves.</p>

            <h2>8. Security</h2>
            <p>We use technical and organizational safeguards intended to protect data, including access controls and tenant-level authorization. No internet service can guarantee absolute security.</p>

            <h2>9. Children's Privacy</h2>
            <p>PocketRep is intended for users 18 years of age and older. We do not knowingly offer the service to children.</p>

            <h2>10. Changes to This Policy</h2>
            <p>We may update this Privacy Policy as the product or our legal obligations change. The current version will be posted here with its updated date.</p>

            <h2>11. Contact</h2>
            <p>Privacy questions or requests: <a href="mailto:privacy@pocketrep.pro">privacy@pocketrep.pro</a>.</p>
          </div>'''
          p = p[:start] + privacy_body + p[end:]
          privacy_path.write_text(p, encoding='utf-8')

          # ------------------------------------------------------------------
          # TERMS — factual consistency only; do not change governing-law clause.
          # ------------------------------------------------------------------
          q = terms_path.read_text(encoding='utf-8')
          q = q.replace('Last updated: April 1, 2026', 'Last updated: August 28, 2026')
          q = replace_once(q,
              'PocketRep provides an AI-powered mobile application that helps sales professionals generate follow-up messages, objection responses, and call summaries using artificial intelligence. The Service is provided on a subscription basis.',
              'PocketRep provides a web-based sales follow-up application with contact organization, reminders, deal tracking, and AI-assisted drafts, coaching, summaries, and related sales workflow tools. The Service is provided on a subscription basis.',
              'terms service description')
          q = replace_once(q,
              '<li>Subscription fees are charged in advance on a monthly or annual basis as selected at signup.</li>',
              '<li>Subscription fees are charged on the billing schedule and at the price shown at checkout. The current individual launch offer is monthly.</li>',
              'terms billing cadence')
          q = replace_once(q,
              '<li>Use AI-generated outputs in ways that deceive, defraud, or harm others.</li>',
              '<li>Use AI-generated outputs in ways that deceive, defraud, or harm others.</li>\n    <li>Upload, retain, export, or contact customer data that you are not authorized to use, or use PocketRep in violation of your employer\'s policies or applicable privacy and communications laws.</li>',
              'terms customer-data responsibility')
          q = q.replace('Questions? Email us at legal@pocketrep.pro', 'Questions? Email us at service@pocketrep.pro')
          terms_path.write_text(q, encoding='utf-8')

          print('Launch funnel audit patch applied successfully.')
          PY

      - name: Commit audited funnel
        shell: bash
        run: |
          git config user.name "PocketRep Launch Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/launch-copy-finalize.yml
          git add Pocketrep/index.html Pocketrep/thankyou.html Pocketrep/cancel.html Pocketrep/privacy.html Pocketrep/terms.html
          git diff --cached --check
