name: Temporary Batch 3 Guarded Runner

on:
  push:
    branches:
      - fix/batch3-rebuild

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/batch3-rebuild
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Stop unless this is the launch commit
        shell: bash
        run: |
          set -euo pipefail
          msg="$(git log -1 --pretty=%s)"
          if [ "$msg" != "tmp: launch Batch 3 guarded rebuild" ]; then
            echo "Not the launch commit; exiting without changes."
            exit 0
          fi

      - name: Carry forward reviewed Batch 3 changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PocketRep QA"
          git config user.email "qa@pocketrep.pro"
          git fetch origin claude/quirky-babbage-f0s519-batch3
          git cherry-pick 0dd8d26f41345d65c49449147a6dd6e300dc5ddb

      - name: Preserve current-main native import safety
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- 'PocketRepApp/app/(tabs)/contacts.tsx'

      - name: Refresh strict patch inputs to verified current text
        working-directory: PocketRepApp
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('scripts/tmp-batch3-rebuild.py')
          s = p.read_text()

          old_guard = "if 'try {' not in s or 'Could not import contacts' not in s:\n    raise SystemExit('contacts: #143 import exception backstop was lost')"
          new_guard = "if \"Alert.alert('Some contacts may not have imported')\" not in s or \"Alert.alert('Import failed', 'Some contacts may not have imported. Check for duplicate phone numbers.')\" not in s:\n    raise SystemExit('contacts: #143 import exception backstops were lost')"
          if old_guard not in s:
              raise SystemExit('could not locate stale #143 assertion in patch script')
          s = s.replace(old_guard, new_guard, 1)

          old_photo = "'PocketRep needs photo access so you can share screenshots with Rex and add photos to your contacts.'"
          verified_photo_source = "'PocketRep needs photo access to share screenshots with Rex and add photos to your contacts.'"
          if old_photo not in s:
              raise SystemExit('could not locate stale photo source assertion in patch script')
          s = s.replace(old_photo, verified_photo_source, 1)

          old_rex = "check(!rex.includes(\"plan === 'elite'\"), 'Rex Memory is not dead-gated on Elite');"
          new_rex = "check(!/if\\s*\\(\\s*profile\\?\\.plan\\s*===\\s*['\\\"]elite['\\\"]\\s*\\)/.test(rex) && !/const\\s+isElite\\s*=/.test(rex), 'Rex Memory is not dead-gated on Elite');"
          if old_rex not in s:
              raise SystemExit('could not locate naive Rex gate assertion')
          s = s.replace(old_rex, new_rex, 1)

          old_digest = "check(!more.includes(\"plan === 'elite'\"), 'Weekly Digest is not dead-gated on Elite');"
          new_digest = "check(!/if\\s*\\(\\s*profile\\?\\.plan\\s*===\\s*['\\\"]elite['\\\"]\\s*\\)/.test(more) && !/const\\s+isElite\\s*=/.test(more), 'Weekly Digest is not dead-gated on Elite');"
          if old_digest not in s:
              raise SystemExit('could not locate naive Weekly Digest gate assertion')
          s = s.replace(old_digest, new_digest, 1)

          old_css = "check(vercel.includes('brand.css') && vercel.includes('seo-pages.css'), 'stable CSS files have explicit cache rule');"
          new_css = """const vercelConfig = JSON.parse(vercel);
const cssCacheRule = (vercelConfig.headers ?? []).find((rule) => {
  if (typeof rule?.source !== 'string') return false;
  try {
    const re = new RegExp(rule.source);
    return re.test('/brand.css') && re.test('/seo-pages.css');
  } catch {
    return false;
  }
});
check(Boolean(cssCacheRule), 'stable CSS files have explicit cache rule');"""
          if old_css not in s:
              raise SystemExit('could not locate naive CSS cache assertion')
          s = s.replace(old_css, new_css, 1)

          p.write_text(s)
          PY

      - name: Apply owner-reviewed corrections
        working-directory: PocketRepApp
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tmp-batch3-rebuild.py

      - name: Verify full PocketRep suite
        working-directory: PocketRepApp
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run lint
          npm run test:all

      - name: Commit rebuilt Batch 3 only after green verification
        shell: bash
        run: |
          set -euo pipefail
          git rm -f PocketRepApp/scripts/tmp-batch3-rebuild.py
          git add PocketRepApp Pocketrep vercel.json
          git status --short
          git commit -m "Rebuild Batch 3 on current main"
          git push origin HEAD:fix/batch3-rebuild
