name: Temporary V1 $39 realignment

on:
  push:
    branches:
      - fix/v1-price-39-realign

permissions:
  contents: write

jobs:
  realign:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1-price-39-realign
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Realign public V1 pricing to $39
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ACTIVE_URL = 'https://buy.stripe.com/cNi4gAbMn4kg9Ax5AucbC06'
          RETIRED_29_URL = 'https://buy.stripe.com/3cI3cw3fRcQM141bYScbC09'
          CURRENT_PRICE = 'price_1Tf6MeIKMImSDGHZvYLmeIqS'
          LEGACY_29_PRICE = 'price_1UBDLeIKMImSDGHZqrYthX3H'

          def must_replace(path, old, new, count=None):
              p = Path(path)
              s = p.read_text()
              hits = s.count(old)
              if hits == 0:
                  raise SystemExit(f'{path}: expected string not found: {old!r}')
              if count is not None and hits != count:
                  raise SystemExit(f'{path}: expected {count} hits for {old!r}, found {hits}')
              p.write_text(s.replace(old, new))
              print(f'{path}: replaced {hits} occurrence(s) of {old!r}')

          # Marketing funnel: only price-bearing strings and the checkout target.
          must_replace('Pocketrep/index.html', RETIRED_29_URL, ACTIVE_URL)
          must_replace('Pocketrep/index.html', '"price":"29.00"', '"price":"39.00"')
          must_replace('Pocketrep/index.html', 'Founding Rep access is 29.00 USD per month', 'Founding Rep access is 39.00 USD per month')
          must_replace('Pocketrep/index.html', 'PocketRep V1 Founding Rep access is 29 USD per month', 'PocketRep V1 Founding Rep access is 39 USD per month')
          must_replace('Pocketrep/index.html', '$29', '$39')

          must_replace('Pocketrep/thankyou.html', '$29', '$39')
          must_replace('Pocketrep/llms.txt', '$29', '$39')
          must_replace('PocketRepApp/app/(auth)/signup.tsx', RETIRED_29_URL, ACTIVE_URL)
          must_replace('PocketRepApp/app/(auth)/signup.tsx', '$29', '$39')

          # Provisioning: current public checkout is $39, but retain the retired $29
          # price in the allowlist so an already-completed/in-flight historical
          # session can still finish account provisioning safely.
          checkout = Path('PocketRepApp/supabase/functions/checkout-account/index.ts')
          s = checkout.read_text()
          old = f'const V1_FOUNDING_PRICE_ID = "{LEGACY_29_PRICE}";'
          new = (
              f'const V1_CURRENT_PRICE_ID = "{CURRENT_PRICE}";\n'
              f'const V1_LEGACY_29_PRICE_ID = "{LEGACY_29_PRICE}";'
          )
          if old not in s:
              raise SystemExit('checkout-account: old V1 price constant not found')
          s = s.replace(old, new, 1)
          old_set = 'return new Set([STRIPE_PRICE_ID, V1_FOUNDING_PRICE_ID].filter(Boolean));'
          new_set = 'return new Set([STRIPE_PRICE_ID, V1_CURRENT_PRICE_ID, V1_LEGACY_29_PRICE_ID].filter(Boolean));'
          if old_set not in s:
              raise SystemExit('checkout-account: allowlist expression not found')
          checkout.write_text(s.replace(old_set, new_set, 1))

          # Living source of truth: preserve historical PR descriptions, update only
          # the current owner decision/current live Stripe resources/status wording.
          decisions = Path('CURRENT_STATE_DECISIONS.md')
          s = decisions.read_text()
          replacements = {
              '- **V1 Founding Rep: $29/month** for the current individual product.':
                '- **V1 Founding Rep: $39/month** for the current individual product.',
              f'- V1 founding price: `{LEGACY_29_PRICE}` — $29/month':
                f'- Current V1 price: `{CURRENT_PRICE}` — $39/month',
              '- V1 founding Payment Link: `plink_1UBDMJIKMImSDGHZWJqPzLRP`':
                '- Current V1 Payment Link: `plink_1TfLSuIKMImSDGHZWS0cW3QV`',
              f'- Checkout URL: `{RETIRED_29_URL}`':
                f'- Checkout URL: `{ACTIVE_URL}`',
              '- `checkout-account` **v15 ACTIVE** as of the 2026-09-02 pricing cutover preparation; it accepts both the prior live PocketRep price and the new V1 founding price while preserving strict checkout/session/customer-rebind verification.':
                '- `checkout-account` **v15 ACTIVE**; current public V1 checkout is the $39 price, while retired $29 sessions remain accepted only for safe historical/in-flight provisioning compatibility. Strict checkout/session/customer-rebind verification remains in place.',
              '- checkout-account v15 dual-price compatibility for the $29 cutover.':
                '- checkout-account v15 dual-price compatibility retained: $39 is current; retired $29 sessions can still complete historical/in-flight provisioning.',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'CURRENT_STATE_DECISIONS.md: expected current-state line missing: {old}')
              s = s.replace(old, new, 1)
          marker = '- **V1 Founding Rep: $39/month** for the current individual product.\n'
          note = '- The temporary $29 launch cutover is **retired**; do not advertise or route new customers to the retired $29 Payment Link.\n'
          if note not in s:
              s = s.replace(marker, marker + note, 1)
          decisions.write_text(s)

          # Rewrite the regression guard around the current $39 launch truth while
          # continuing to block the unsupported/fabricated landing claims removed in #134.
          Path('PocketRepApp/scripts/test-pricing-cutover.mjs').write_text(r'''import { readFileSync } from 'node:fs';
          import { dirname, resolve } from 'node:path';
          import { fileURLToPath } from 'node:url';

          const here = dirname(fileURLToPath(import.meta.url));
          const appRoot = resolve(here, '..');
          const repoRoot = resolve(appRoot, '..');

          const landing = readFileSync(resolve(repoRoot, 'Pocketrep/index.html'), 'utf8');
          const thankyou = readFileSync(resolve(repoRoot, 'Pocketrep/thankyou.html'), 'utf8');
          const llms = readFileSync(resolve(repoRoot, 'Pocketrep/llms.txt'), 'utf8');
          const signup = readFileSync(resolve(appRoot, 'app/(auth)/signup.tsx'), 'utf8');
          const checkout = readFileSync(resolve(appRoot, 'supabase/functions/checkout-account/index.ts'), 'utf8');
          const decisions = readFileSync(resolve(repoRoot, 'CURRENT_STATE_DECISIONS.md'), 'utf8');

          const CURRENT_URL = 'https://buy.stripe.com/cNi4gAbMn4kg9Ax5AucbC06';
          const RETIRED_29_URL = 'https://buy.stripe.com/3cI3cw3fRcQM141bYScbC09';
          const CURRENT_PRICE = 'price_1Tf6MeIKMImSDGHZvYLmeIqS';
          const LEGACY_29_PRICE = 'price_1UBDLeIKMImSDGHZqrYthX3H';

          function requireIncludes(label, source, needles) {
            for (const needle of needles) {
              if (!source.includes(needle)) throw new Error(`${label}: missing ${needle}`);
            }
          }

          function requireExcludes(label, source, needles) {
            for (const needle of needles) {
              if (source.includes(needle)) throw new Error(`${label}: stale/unsupported launch value remains: ${needle}`);
            }
          }

          requireIncludes('landing', landing, [
            '"price":"39.00"',
            '<span class="now">$39</span>',
            'Founding Rep access is $39/month',
            'Day 8 — $39/mo begins if the subscription is still active',
            'Is PocketRep worth $39 a month?',
            '$39/mo Founding Rep rate.',
            'Founding rate · $39/mo while subscription stays active',
            CURRENT_URL,
            '7-day free trial',
          ]);
          requireExcludes('landing', landing, [
            RETIRED_29_URL,
            '"price":"29.00"',
            '<span class="now">$29</span>',
            'Founding Rep access is $29/month',
            'Day 8 — $29/mo begins',
            'Is PocketRep worth $29 a month?',
            '$29/mo Founding Rep rate.',
            'Founding rate · $29/mo while subscription stays active',
            'Next new-customer cohort: $54/mo after the first 500',
            'First 500 paying reps',
            '39 USD per month for the first 500',
            'The first 500 paying reps get the $39 monthly founding rate',
            '$39/mo founding rate for the first 500 paying reps',
            'Founding rate · $39/mo locked forever',
            'still here with your name on it',
            'trade at the top of the range',
            'charging + warranty are no contest',
            'saved you the 540i',
            'm340i in portimao is rare',
            'want me to hold it while you decide',
          ]);

          requireIncludes('thankyou', thankyou, ['$39 founding software subscription rate']);
          requireExcludes('thankyou', thankyou, ['$29 founding software subscription rate']);

          requireIncludes('llms', llms, ['$39 per month', '7-day free trial', 'continuously active']);
          requireExcludes('llms', llms, ['$29 per month']);

          requireIncludes('signup', signup, [CURRENT_URL, 'FOUNDING REP', '$39', 'automotive sales reps']);
          requireExcludes('signup', signup, [RETIRED_29_URL, '$29', "name: 'Rex Lens'", "name: 'PocketRep Elite", 'What do you sell?']);

          requireIncludes('checkout-account', checkout, [
            `const V1_CURRENT_PRICE_ID = "${CURRENT_PRICE}"`,
            `const V1_LEGACY_29_PRICE_ID = "${LEGACY_29_PRICE}"`,
            'allowedStripePriceIds()',
            '!allowedPriceIds.has(checkoutPriceId)',
            'account_already_billed',
          ]);

          requireIncludes('decisions', decisions, [
            '**V1 Founding Rep: $39/month**',
            'temporary $29 launch cutover is **retired**',
            `Current V1 price: \`${CURRENT_PRICE}\` — $39/month`,
            `Checkout URL: \`${CURRENT_URL}\``,
            '**V2 direction for new customers: $49/month**',
            '**V3 direction for new customers: $69/month**',
            '**RexLens is separate/out-of-scope from PocketRep.',
          ]);

          console.log('PocketRep V1 $39 pricing alignment guard OK');
          '''.replace(/^          /gm, ''))
          PY

          rm -f .github/workflows/tmp-price39-realign.yml
          git config user.name "PocketRep Pricing Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: realign PocketRep V1 launch pricing to $39"
          git push origin HEAD:fix/v1-price-39-realign
