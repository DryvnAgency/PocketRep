name: Referral cap atomic transform

on:
  push:
    branches: [fix/referral-cap-atomic]

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/referral-cap-atomic
      - name: Route reward paths through atomic reservation RPC
        env:
          WEBHOOK_BLOCK_B64:  
          SCHEDULER_BLOCK_B64:  
        run: |
          python3 - <<'PY'
          import base64, os, re
          from pathlib import Path
          webhook = Path('PocketRepApp/supabase/functions/stripe-webhook/index.ts')
          s = webhook.read_text()
          block = base64.b64decode(os.environ['WEBHOOK_BLOCK_B64'].replace(' ', '')).decode()
          pattern = re.compile(r'const REFERRAL_REWARD_CAP_MONTHS = 24;\n\nasync function reward\(admin: any, referral: any\) \{.*?\n\}\n\n(?=Deno\.serve)', re.S)
          s2, n = pattern.subn(block + '\n', s)
          if n != 1: raise SystemExit(f'webhook reward transform matched {n}')
          webhook.write_text(s2)
          scheduler = Path('PocketRepApp/supabase/functions/nurture-scheduler/index.ts')
          s = scheduler.read_text()
          block = base64.b64decode(os.environ['SCHEDULER_BLOCK_B64'].replace(' ', '')).decode()
          pattern = re.compile(r'const REFERRAL_REWARD_CAP_MONTHS = 24;\n\nasync function rewardReferral\(admin: ReturnType<typeof createClient>, referral: any\): Promise<void> \{.*?\n\}\n\n(?=async function reconcileStuckReferrals)', re.S)
          s2, n = pattern.subn(block + '\n', s)
          if n != 1: raise SystemExit(f'scheduler reward transform matched {n}')
          scheduler.write_text(s2)
          PY
      - name: Commit transformed reward paths
        run: |
          git config user.name "PocketRep Launch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add PocketRepApp/supabase/functions/stripe-webhook/index.ts PocketRepApp/supabase/functions/nurture-scheduler/index.ts
          git commit -m "Use atomic referral reward reservation"
          git push origin HEAD:fix/referral-cap-atomic
