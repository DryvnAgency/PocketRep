name: Referral cap atomic transform

on:
  push:
    branches: [fix/referral-cap-atomic]

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/referral-cap-atomic
      - name: Harden referral cap regression coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          webhook = Path('PocketRepApp/supabase/functions/stripe-webhook/index.ts')
          s = webhook.read_text().replace("`subscriptions?customer=${encodeURIComponent(p.stripe_customer_id)}&status=all&limit=10`.replace(' ','')", "`subscriptions?customer=${encodeURIComponent(p.stripe_customer_id)}&status=all&limit=10`")
          webhook.write_text(s)

          test = Path('PocketRepApp/scripts/test-referral.mjs')
          s = test.read_text()
          marker = '// ── Atomic 24-month reward cap ─────────────────────────────────────────'
          if marker not in s:
              block = r'''

// ── Atomic 24-month reward cap ─────────────────────────────────────────

const { readFileSync } = await import('node:fs');
const migrationSource = readFileSync('supabase/migrations/20260902133500_referral_reward_cap_atomic.sql', 'utf8');
const webhookSource = readFileSync('supabase/functions/stripe-webhook/index.ts', 'utf8');
const schedulerSource = readFileSync('supabase/functions/nurture-scheduler/index.ts', 'utf8');

ok(migrationSource.includes('pg_advisory_xact_lock'),
  '24-month cap reservation serializes concurrent rewards per recipient');
ok(migrationSource.includes("status in ('pending', 'applied')"),
  'pending reservations count toward the 24-month cap');
ok(migrationSource.includes("'cap_reached'::text"),
  'atomic reservation returns an explicit cap-reached result');
ok(migrationSource.includes("auth.role() <> 'service_role'"),
  'reward reservation RPC is service-role only');
ok(webhookSource.includes('admin.rpc("reserve_referral_reward"'),
  'Stripe webhook uses atomic reward reservation');
ok(schedulerSource.includes("admin.rpc('reserve_referral_reward'"),
  'referral reconciliation uses atomic reward reservation');
ok(!webhookSource.includes(".eq(\"status\", \"applied\");\n      const totalApplied"),
  'Stripe webhook no longer performs the race-prone read-then-insert cap check');
ok(!schedulerSource.includes(".eq('status', 'applied');\n      const totalApplied"),
  'reconciliation no longer performs the race-prone read-then-insert cap check');
'''
              summary = '// ── Summary ─────────────────────────────────────────────────────────────'
              if summary not in s:
                  raise SystemExit('referral summary marker missing')
              s = s.replace(summary, block + '\n' + summary)
              test.write_text(s)
          PY
          rm .github/workflows/referral-cap-transform.yml
      - name: Commit final referral cap hardening
        run: |
          git config user.name "PocketRep Launch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Harden atomic 24-month referral cap"
          git push origin HEAD:fix/referral-cap-atomic
