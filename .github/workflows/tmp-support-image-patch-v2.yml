name: Temporary support image wiring v2
on:
  push:
    branches: [fix/support-image-attachments]
    paths: ['.github/workflows/tmp-support-image-patch-v2.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/support-image-attachments
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch rep/admin support chat
        run: |
          python - <<'PY'
          from pathlib import Path
          def r(text, old, new, label):
              if old not in text: raise SystemExit('missing anchor: '+label)
              return text.replace(old,new,1)

          p=Path('PocketRepApp/components/v2/SupportChat.tsx'); s=p.read_text()
          s=r(s,"import { colors, radius } from '@/constants/theme';\n","import { colors, radius } from '@/constants/theme';\nimport * as ImagePicker from 'expo-image-picker';\nimport SupportAttachment from './SupportAttachment';\n",'rep imports')
          s=r(s,"  loadMyTickets, createTicket, loadMessages, sendMessage, reopenTicket,\n","  loadMyTickets, createTicket, loadMessages, sendMessage, sendImageMessage, reopenTicket,\n",'rep data')
          s=r(s,"  const [sending, setSending] = useState(false);\n","  const [sending, setSending] = useState(false);\n  const [uploading, setUploading] = useState(false);\n",'rep state')
          h="""  const handleAttach = async () => {\n    if (!selectedTicketId || uploading || sending) return;\n    setUploading(true);\n    try {\n      const permission = await ImagePicker.requestMediaLibraryPermissionsAsync();\n      if (!permission.granted) { setError('Photo access is required to attach a screenshot'); return; }\n      const picked = await ImagePicker.launchImageLibraryAsync({ mediaTypes: ImagePicker.MediaTypeOptions.Images, allowsEditing: false, quality: 0.85 });\n      if (picked.canceled || !picked.assets?.[0]) return;\n      const asset = picked.assets[0];\n      await sendImageMessage({ ticketId: selectedTicketId, senderRole: 'rep', uri: asset.uri, mimeType: asset.mimeType, fileName: asset.fileName, fileSize: asset.fileSize });\n      setError(''); setRefreshKey(k => k + 1);\n    } catch (e) { setError(e instanceof Error ? e.message : 'Could not attach image - try again'); }\n    finally { setUploading(false); }\n  };\n\n"""
          s=r(s,"  const handleCreateTicket = async () => {\n",h+"  const handleCreateTicket = async () => {\n",'rep handler')
          s=r(s,"              <Text style={styles.bubbleText}>{m.content}</Text>\n","              {m.content && m.content !== '[Image attachment]' ? <Text style={styles.bubbleText}>{m.content}</Text> : null}\n              {m.attachment_path ? <SupportAttachment path={m.attachment_path} name={m.attachment_name} /> : null}\n",'rep render')
          s=r(s,"          <TextInput\n            style={styles.input}\n","          <Pressable style={[styles.sendBtn, (uploading || sending) && { opacity: 0.4 }]} onPress={handleAttach} disabled={uploading || sending} accessibilityLabel=\"Attach image\">\n            <Text style={styles.sendIcon}>{uploading ? '…' : '📎'}</Text>\n          </Pressable>\n          <TextInput\n            style={styles.input}\n",'rep paperclip')
          s=s.replace("editable={!sending}","editable={!sending && !uploading}",1); p.write_text(s)

          p=Path('PocketRepApp/components/v2/AdminSupportDashboard.tsx'); s=p.read_text()
          s=r(s,"import { colors, radius } from '@/constants/theme';\n","import { colors, radius } from '@/constants/theme';\nimport * as ImagePicker from 'expo-image-picker';\nimport SupportAttachment from './SupportAttachment';\n",'admin imports')
          s=r(s,"  loadAllTickets, loadMessages, sendMessage, resolveTicket, reopenTicket,\n","  loadAllTickets, loadMessages, sendMessage, sendImageMessage, resolveTicket, reopenTicket,\n",'admin data')
          s=r(s,"  const [sending, setSending] = useState(false);\n","  const [sending, setSending] = useState(false);\n  const [uploading, setUploading] = useState(false);\n",'admin state')
          h="""  const handleAttach = async () => {\n    const ticketOwner = tickets.find(t => t.id === selectedTicketId)?.user_id;\n    if (!selectedTicketId || !ticketOwner || uploading || sending) return;\n    setUploading(true);\n    try {\n      const permission = await ImagePicker.requestMediaLibraryPermissionsAsync();\n      if (!permission.granted) { setError('Photo access is required to attach a screenshot'); return; }\n      const picked = await ImagePicker.launchImageLibraryAsync({ mediaTypes: ImagePicker.MediaTypeOptions.Images, allowsEditing: false, quality: 0.85 });\n      if (picked.canceled || !picked.assets?.[0]) return;\n      const asset = picked.assets[0];\n      await sendImageMessage({ ticketId: selectedTicketId, senderRole: 'admin', ownerUserId: ticketOwner, uri: asset.uri, mimeType: asset.mimeType, fileName: asset.fileName, fileSize: asset.fileSize });\n      setError(''); setRefreshKey(k => k + 1);\n    } catch (e) { setError(e instanceof Error ? e.message : 'Could not attach image - try again'); }\n    finally { setUploading(false); }\n  };\n\n"""
          s=r(s,"  const handleResolve = async () => {\n",h+"  const handleResolve = async () => {\n",'admin handler')
          s=r(s,"              <Text style={styles.bubbleText}>{m.content}</Text>\n","              {m.content && m.content !== '[Image attachment]' ? <Text style={styles.bubbleText}>{m.content}</Text> : null}\n              {m.attachment_path ? <SupportAttachment path={m.attachment_path} name={m.attachment_name} /> : null}\n",'admin render')
          s=r(s,"            <TextInput\n              style={styles.input}\n","            <Pressable style={[styles.sendBtn, (uploading || sending) && { opacity: 0.4 }]} onPress={handleAttach} disabled={uploading || sending} accessibilityLabel=\"Attach image\">\n              <Text style={styles.sendIcon}>{uploading ? '…' : '📎'}</Text>\n            </Pressable>\n            <TextInput\n              style={styles.input}\n",'admin paperclip')
          s=s.replace("editable={!sending}","editable={!sending && !uploading}",1); p.write_text(s)
          PY
          git config user.name 'DryvnAgency'
          git config user.email 'dryvnagency@gmail.com'
          git add PocketRepApp/components/v2/SupportChat.tsx PocketRepApp/components/v2/AdminSupportDashboard.tsx
          git commit -m 'support: wire image attachments in rep and admin chat'
          git push origin HEAD:fix/support-image-attachments
