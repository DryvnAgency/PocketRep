name: Align current state after PR 134

on:
  push:
    branches: [docs/align-post-134-runtime]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/align-post-134-runtime
      - name: Align verified runtime baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('CURRENT_STATE_DECISIONS.md')
          s = p.read_text()
          s = s.replace(
            'Last verified PocketRep runtime-affecting Git baseline before the V1 pricing cutover branch:\n\n`b7d3e180f5f172811af9968f34b6910e1a966605` — PR #131',
            'Last verified PocketRep runtime-affecting Git baseline:\n\n`1aa51de19ff3b8636cebab535c3ff40b19c04f4d` — PR #134'
          )
          marker = '- **#131** — appointment evidence boundary, cross-customer context isolation, inventory truth rail.\n'
          add = marker + '- **#133** — V1 $29 Founding Rep cutover across landing, app signup, thank-you, checkout validation, AI-readable pricing, and current-state decisions; existing paying $39 subscriptions preserved.\n- **#134** — completed visible landing $29 alignment, removed unsupported demo urgency/value claims, and hardened the pricing/truthfulness regression guard.\n'
          if '- **#133** — V1 $29 Founding Rep cutover' not in s:
            if marker not in s: raise SystemExit('recent sequence marker missing')
            s = s.replace(marker, add)
          eval_marker = '- checkout-account v15 dual-price compatibility for the $29 cutover.\n'
          eval_add = eval_marker + '- V1 $29 Founding Rep funnel cutover merged and live (#133).\n- remaining stale $39 landing copy and unsupported demo claims removed; regression guard hardened (#134).\n- post-#134 production verification: marketing and app deployments READY on commit `1aa51de19ff3b8636cebab535c3ff40b19c04f4d`; direct production landing fetch showed the $29 offer and new Stripe link; app error/fatal logs were empty for the checked one-hour window.\n'
          if '- V1 $29 Founding Rep funnel cutover merged and live (#133).' not in s:
            if eval_marker not in s: raise SystemExit('evaluation marker missing')
            s = s.replace(eval_marker, eval_add)
          old_now = '1. Complete and verify the **$29 V1 founding pricing cutover** end-to-end: landing → Stripe → thank-you → provisioning → login.\n2. Keep adversarial Rex/V1 evaluation running across appointment, trade, ghosted, sold, program, whole-book, malformed/hostile, and legacy-client scenarios.\n3. Premium app aesthetic/microcopy pass without changing workflow architecture.\n4. Final end-to-end launch audit from landing through daily execution and next action.\n5. Verify referral 24-month cap at launch scale.\n6. Keep landing, checkout, thank-you, support, app, and AI-readable claims aligned with V1 reality.'
          new_now = '1. Keep adversarial Rex/V1 evaluation running across appointment, trade, ghosted, sold, program, whole-book, malformed/hostile, and legacy-client scenarios.\n2. Final end-to-end launch audit from landing through checkout/provisioning/login, then daily execution and next action.\n3. Verify referral 24-month cap at launch scale.\n4. Premium app aesthetic/microcopy pass without changing workflow architecture.\n5. Keep landing, checkout, thank-you, support, app, and AI-readable claims aligned with V1 reality.'
          if old_now in s:
            s = s.replace(old_now, new_now)
          else:
            raise SystemExit('NOW block mismatch')
          p.write_text(s)
          PY
      - name: Commit current-state alignment
        run: |
          git config user.name "PocketRep Launch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add CURRENT_STATE_DECISIONS.md
          git commit -m "Align current state with verified PR 134 runtime"
          git push origin HEAD:docs/align-post-134-runtime
