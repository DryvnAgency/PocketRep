name: Apply entitlement sync hotfix
on:
  push:
    branches:
      - claude/quirky-babbage-f0s519
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/quirky-babbage-f0s519
          fetch-depth: 0
      - name: Patch billing entitlement synchronization
        run: |
          python3 - <<'PY'
          from pathlib import Path

          checkout = Path('PocketRepApp/supabase/functions/checkout-account/index.ts')
          s = checkout.read_text()
          old = "const _verified=['active','trialing'].includes((subscriptionStatus??'').toLowerCase());await admin.from(\"profiles\").update(Object.assign({stripe_customer_id:customerId,plan:\"pocketrep\",subscription_status:subscriptionStatus??'active',trial_ends_at:trialEndsAt},_verified?{entitlement_status:null,entitlement_pending_until:null}:{entitlement_status:'pending',entitlement_pending_until:new Date(Date.now()+5*60*1000).toISOString()})).eq(\"id\",userId);"
          new = "const normalizedStatus=(subscriptionStatus??'active').toLowerCase();const _verified=['active','trialing'].includes(normalizedStatus);const profilePatch=Object.assign({stripe_customer_id:customerId,plan:\"pocketrep\",subscription_status:normalizedStatus,trial_ends_at:trialEndsAt},_verified?{entitlement_status:normalizedStatus,entitlement_pending_until:null}:{entitlement_status:'pending',entitlement_pending_until:new Date(Date.now()+5*60*1000).toISOString()});const{error:profileUpdateErr}=await admin.from(\"profiles\").update(profilePatch).eq(\"id\",userId);if(profileUpdateErr){console.error(\"checkout-account profile update failed:\",profileUpdateErr.message);return json({ok:false,error:\"profile_update_failed\"},500,origin);}"
          if old not in s:
              raise SystemExit('checkout-account target not found')
          checkout.write_text(s.replace(old, new, 1))

          webhook = Path('PocketRepApp/supabase/functions/stripe-webhook/index.ts')
          w = webhook.read_text()
          old = "if (profileId) await admin.from(\"profiles\").update(Object.assign({ plan: \"pocketrep\", subscription_status: s.status, trial_ends_at: s.status === \"trialing\" && s.trial_end ? new Date(s.trial_end * 1000).toISOString() : null }, [\"active\",\"trialing\"].includes(s.status) ? { entitlement_status: null, entitlement_pending_until: null } : {})).eq(\"id\", profileId);"
          new = "if (profileId) { const entitlementStatus = s.status === \"trialing\" ? \"trialing\" : s.status === \"active\" ? \"active\" : s.status === \"past_due\" ? \"past_due\" : s.status === \"canceled\" ? \"canceled\" : \"locked\"; await admin.from(\"profiles\").update({ plan: \"pocketrep\", subscription_status: s.status, trial_ends_at: s.status === \"trialing\" && s.trial_end ? new Date(s.trial_end * 1000).toISOString() : null, entitlement_status: entitlementStatus, entitlement_pending_until: null }).eq(\"id\", profileId); }"
          if old not in w:
              raise SystemExit('subscription update target not found')
          w = w.replace(old, new, 1)
          replacements = {
            'update({ subscription_status: \"canceled\" }).eq(\"id\", profileId);': 'update({ subscription_status: \"canceled\", entitlement_status: \"canceled\", entitlement_pending_until: null }).eq(\"id\", profileId);',
            'update({ subscription_status: \"past_due\" }).eq(\"id\", profileId);': 'update({ subscription_status: \"past_due\", entitlement_status: \"past_due\", entitlement_pending_until: null }).eq(\"id\", profileId);',
            'update({ subscription_status: \"active\", entitlement_status: null, entitlement_pending_until: null }).eq(\"id\", profileId);': 'update({ subscription_status: \"active\", entitlement_status: \"active\", entitlement_pending_until: null }).eq(\"id\", profileId);'
          }
          for a,b in replacements.items():
              if a not in w:
                  raise SystemExit(f'webhook target not found: {a}')
              w = w.replace(a,b,1)
          webhook.write_text(w)

          wf = Path('.github/workflows/fix-entitlement-sync.yml')
          wf.unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: synchronize verified Stripe entitlements"
          git push origin HEAD:claude/quirky-babbage-f0s519
