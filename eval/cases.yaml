# P2-R5 — Rex action-selection seed cases (~26). Each case asserts the brain picks
# the expected `action` (see assertAction.js + defaultTest in promptfooconfig.yaml).
# This is a SEED to grow toward the 150-utterance target — add rows here (and harder
# payload-level asserts per row when needed). Keep BOOK STATE refs (Marcus, the two
# Marias, Dave, Priya) consistent with rexPrompt.txt.

# --- add_contact ---
- description: new lead by name + vehicle
  vars:
    utterance: "Add a new lead, Jordan Price, looking at a 2022 Tahoe"
    expected_action: add_contact
- description: jot a walk-in
  vars:
    utterance: "New customer just walked in, Sarah Kim, wants a CR-V"
    expected_action: add_contact

# --- update_notes ---
- description: append a note to an unambiguous contact
  vars:
    utterance: "Note on Marcus: he wants to keep his payment under six hundred"
    expected_action: update_notes
- description: log what a customer said
  vars:
    utterance: "Add a note to Dave Chen that he's deciding between the F-150 and the Ram"
    expected_action: update_notes

# --- delete_contact ---
- description: remove a contact
  vars:
    utterance: "Delete Priya Shah, she bought somewhere else"
    expected_action: delete_contact

# --- log_deal ---
- description: closed sale with grosses
  vars:
    utterance: "Log a deal for Marcus Bell, stock B1234, the M3, twenty eight hundred front and twelve hundred back"
    expected_action: log_deal
- description: cash deal
  vars:
    utterance: "I just sold Dave the F-150, stock F908, three grand front, eight hundred back"
    expected_action: log_deal

